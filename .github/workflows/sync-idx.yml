name: IDX BSJP Data Sync & Auto Deploy

on:
  schedule:
    # 15:35 WIB (08:35 UTC) Monday-Friday - Early Radar
    - cron: '35 8 * * 1-5'
    # 15:50 WIB (08:50 UTC) Monday-Friday - Pre-Closing Auction Entry
    - cron: '50 8 * * 1-5'
    # 16:15 WIB (09:15 UTC) Monday-Friday - Official Market Close Final Snapshot
    - cron: '15 9 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI anytime

concurrency:
  group: sync-idx-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-data:
    name: Sync Real IDX Market Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv (Fast Python Package Manager)
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Run Self-Contained IDX Real Data Sync
        run: |
          uv run --with pandas --with pyarrow --with numpy python scripts/syncIdxRealData.py

      - name: Verify Generated Snapshots
        run: |
          node scripts/testRealScreener.mjs
          node scripts/testEngine.mjs

      - name: Check for Data Changes
        id: git_status
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain data/)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit & Push New Snapshot to Main
        if: steps.git_status.outputs.has_changes == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          TIMESTAMP=$(date -u -d '+7 hours' '+%Y-%m-%d %H:%M WIB')
          git commit -m "chore(data): auto-sync IDX BSJP market snapshot ($TIMESTAMP)"
          git push origin main

